# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "imon"
BBFILE_PATTERN_imon = "^${LAYERDIR}/"
BBFILE_PRIORITY_imon = "10"

LAYERDEPENDS_imon = "core"
LAYERSERIES_COMPAT_imon = "scarthgap"

IMON_LAYER_PATH := "${LAYERDIR}"