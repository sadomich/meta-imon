#@TYPE: Machine
#@NAME: NPE X500 M3 (CM3)
#@DESCRIPTION: Machine configuration for NPE X500 M3 board (CM3)

MACHINEOVERRIDES = "raspberrypi3-64:${MACHINE}"
include conf/machine/raspberrypi3-64.conf
include conf/machine/include/common.conf

WKS_FILE = "imon-msdos-emmc-4g.wks"

KERNEL_MODULE_AUTOLOAD += "i2c-dev i2c-bcm2708 mcp3422 rtc_ds1307"

KERNEL_DEVICETREE:append = " overlays/x500-adc.dtbo overlays/x500-hdmi.dtbo overlays/x500-led.dtbo overlays/x500-nxp-uart.dtbo overlays/x500-rtc.dtbo overlays/x500-uart0-rs485.dtbo overlays/x500-mcp230xx.dtbo"

ENABLE_I2C = "1"
ENABLE_SPI_BUS = "1"
ENABLE_UART = "1"

SERIAL_CONSOLES = ""

DISABLE_VC4GRAPHICS = "1"
#ENABLE_W1 = "1"

NPE_EXTRA_CONFIG = '\n\
# PCIE MODEM\n\
gpio=30=op,pd,dl\n\
gpio=31=op,pu,dh\n\
# NXP uart\n\
gpio=26=op,pu,dh\n\
\n\
# NPE x500 extra config\n\
dtoverlay=x500\n\
dtoverlay=dwc2,dr_mode=host\n\
dtparam=i2c_arm=on\n\
dtparam=i2c0=on\n\
i2c0_baudrate=400000\n\
\n\
# UART\n\
dtoverlay=pi3-miniuart-bt\n\
dtparam=uart1=on\n\
\n\
dtoverlay=x500-adc\n\
dtoverlay=x500-hdmi\n\
dtoverlay=x500-led\n\
dtoverlay=x500-nxp-uart\n\
dtoverlay=x500-uart0-rs485\n\
dtoverlay=x500-rtc\n\
# i2c DIO\n\
dtoverlay=x500-mcp230xx\n\
'

RPI_EXTRA_CONFIG:append = '${NPE_EXTRA_CONFIG}'
