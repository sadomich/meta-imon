[system]
compatible=iMonOS
bootloader=uboot
data-directory=/data/rauc

[log.readable]
filename = rauc-history.log

[keyring]
path=/etc/rauc/ca.cert.pem

[slot.boot.0]
device=/dev/mmcblk0
type=boot-gpt-switch
region-start=4M
region-size=100M

[slot.kernel.0]
device=/dev/mmcblk0p3
type=ext4
parent=rootfs.0

[slot.kernel.1]
device=/dev/mmcblk0p4
type=ext4
parent=rootfs.1

[slot.rootfs.0]
device=/dev/mmcblk0p5
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p6
type=ext4
bootname=B
